<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon Mech · Charlotte · IMI 2026</title>
<style>
  :root {
    --bg: #f2ebd8;
    --fg: #1b2a4e;
    --muted: #666;
    --accent: #1b2a4e;
    --card: #fff;
    --border: #ddd;
    --good: #1c7c3a;
    --bad: #a82020;
    --navy: #1b2a4e;
    --carolina: #7bb6e6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; color: var(--fg);
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               -webkit-font-smoothing: antialiased; }
  body { background:
           url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='10'><path d='M3 0 L6 5 L3 10' stroke='%231b2a4e' stroke-width='2' fill='none' stroke-linecap='square' stroke-linejoin='miter'/></svg>"),
           var(--bg);
         background-attachment: fixed; }
  header { background: var(--navy); color: #fff; padding: 14px 20px;
           display: flex; align-items: center; gap: 12px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  header .subtitle { font-size: 12px; opacity: 0.8; margin-top: 2px; }
  header .header-right { margin-left: auto; text-align: right; font-size: 11px;
                         opacity: 0.85; line-height: 1.3; }
  header .last-updated-label { text-transform: uppercase; letter-spacing: 0.05em;
                                font-size: 9px; opacity: 0.7; }
  .imi-dots { display: flex; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  nav.tabs { display: flex; background: #fff; border-bottom: 1px solid var(--border);
             overflow-x: auto; position: sticky; top: 0; z-index: 10; }
  nav.tabs button { background: transparent; border: 0; padding: 14px 18px;
                    font-size: 14px; font-weight: 600; color: var(--muted);
                    cursor: pointer; border-bottom: 3px solid transparent; }
  nav.tabs button.active { color: var(--navy); border-bottom-color: var(--carolina); }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .panel > h2,
  .panel > h3,
  .panel > p.label,
  .panel > div.label,
  .panel > div:has(> h2) { background: var(--card); border: 1px solid var(--border);
                           border-radius: 8px; padding: 10px 14px;
                           margin: 0 0 12px 0; }
  .panel > h2 { font-size: 18px; }
  .card { background: var(--card); border: 1px solid var(--border);
          border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 6px 0; font-size: 14px; color: var(--muted);
             text-transform: uppercase; letter-spacing: 0.5px; }
  .card .big { font-size: 32px; font-weight: 700; }
  .label { font-size: 12px; color: var(--muted); text-transform: uppercase;
           letter-spacing: 0.5px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px;
           font-size: 12px; font-weight: 700; }
  .badge.win { background: #e6f3ea; color: var(--good); }
  .badge.loss { background: #fbe6e6; color: var(--bad); }
  .badge.playoff { background: var(--carolina); color: var(--navy); margin-left: 6px;
                   text-transform: uppercase; letter-spacing: 0.04em; }
  .row { display: flex; justify-content: space-between; align-items: center;
         padding: 10px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
          gap: 10px; }
  button.primary { background: var(--navy); color: #fff; border: 0;
                   padding: 10px 16px; border-radius: 6px; font-weight: 600;
                   cursor: pointer; }
  button.secondary { background: #fff; color: var(--navy); border: 1px solid var(--navy);
                     padding: 10px 16px; border-radius: 6px; font-weight: 600;
                     cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff;
          border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { background: #f0f0ed; cursor: pointer; user-select: none; }
  /* Modal */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
              z-index: 100; align-items: center; justify-content: center; padding: 16px; }
  .modal-bg.active { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 20px; max-width: 500px;
           width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal h2 { margin: 0 0 4px 0; font-size: 18px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
           background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 6px;
           opacity: 0; transition: opacity 0.2s; z-index: 200; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="imi-dots">
    <span class="dot" style="background:#cc2027"></span>
    <span class="dot" style="background:#1a6fc4"></span>
    <span class="dot" style="background:#5aaa35"></span>
    <span class="dot" style="background:#e87722"></span>
  </div>
  <div>
    <h1>Icon Mech · Charlotte</h1>
    <div class="subtitle" id="season-label">Softball 2026 Season</div>
  </div>
  <div class="header-right">
    <div class="last-updated-label">Updated</div>
    <div id="last-updated">—</div>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="home" class="active">Home</button>
  <button data-tab="schedule">Schedule</button>
  <button data-tab="stats">Stats</button>
  <button data-tab="seasons">Seasons</button>
</nav>

<main>
  <section id="home" class="panel active"></section>
  <section id="schedule" class="panel"></section>
  <section id="stats" class="panel"></section>
  <section id="seasons" class="panel"></section>
</main>

<div class="modal-bg" id="rsvp-modal">
  <div class="modal" id="rsvp-modal-content"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Global state
let DATA = null;
let KEYS = null;
let sb = null;   // Supabase client
let RSVPS = {};  // { "YYYY-MM-DD": { nick: { status, ts } } }

// --- Tab switching ---
document.getElementById("tabs").addEventListener("click", (e) => {
  if (e.target.tagName !== "BUTTON") return;
  const tab = e.target.dataset.tab;
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === tab));
});

// --- Toast helper ---
// Format a "HH:MM" 24-hour string as 12-hour with AM/PM. Empty string passes through.
function fmtTime(t) {
  if (!t) return "";
  const [h, m] = t.split(":").map(Number);
  if (isNaN(h) || isNaN(m)) return t;
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2, "0")} ${period}`;
}

// "Park Road Park, Field 3 · 6:30 PM", with TBD filling whichever part isn't set yet.
function whereWhen(g) {
  const loc = g.location || "", time = fmtTime(g.time);
  if (!loc && !time) return "Field &amp; time TBD";
  return `${loc || "Field TBD"} · ${time || "Time TBD"}`;
}

// Format a "YYYY-MM-DD" string as "June 11th, 2026". Parsed manually (not via
// Date) so it never shifts across time zones. Empty/invalid input passes through.
function fmtDate(d) {
  if (!d) return "";
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
  if (!m) return d;
  const months = ["January", "February", "March", "April", "May", "June",
                  "July", "August", "September", "October", "November", "December"];
  const year = m[1], month = months[Number(m[2]) - 1], day = Number(m[3]);
  if (!month) return d;
  const ones = day % 10, tens = day % 100;
  const suffix = (tens >= 11 && tens <= 13) ? "th"
               : ones === 1 ? "st" : ones === 2 ? "nd" : ones === 3 ? "rd" : "th";
  return `${month} ${day}${suffix}, ${year}`;
}

// Normalize a team name for fuzzy matching: lowercase, drop a trailing
// qualifier after a dash/en-dash, strip punctuation, collapse whitespace.
function normalizeTeamName(name) {
  if (!name) return "";
  let s = String(name).toLowerCase();
  s = s.split(/\s*[–-]\s*/)[0];
  s = s.replace(/[^a-z0-9 ]/g, " ");
  s = s.replace(/\s+/g, " ").trim();
  return s;
}

// Build the league standings table for a season. `teams` is a stored standings
// array; `games` is that season's schedule, used to fill the head-to-head
// RESULT column against us. Returns "" when the feed has no teams yet.
function standingsTableHtml(teams, games) {
  if (!Array.isArray(teams)) return "";
  // The feed carries playoff bracket placeholders ("Winner of Previous - Men")
  // that have played nothing. Drop any 0-game row; it returns once it plays.
  // Preseason (nobody has played yet) keeps every row so the field still shows.
  const gp = t => t.W + t.L + t.T;
  if (teams.some(t => gp(t) > 0)) teams = teams.filter(t => gp(t) > 0);
  if (teams.length === 0) return "";
  // The league standings feed lists our team as "Icon" (season.team is "Icon Mech").
  const US_TEAM_KEY = "icon";
  const playedByOpp = {};
  (games || []).filter(g => g.status === "played").forEach(g => {
    const key = normalizeTeamName(g.opponent);
    if (!key) return;
    (playedByOpp[key] = playedByOpp[key] || []).push(g.result || {});
  });

  const cols = ["W", "L", "T", "PF", "PA", "PD", "PCT", "GP"];
  let rows = "";
  teams.forEach(raw => {
    const t = computeStandingsRow(raw);
    const isUs = normalizeTeamName(t.team) === US_TEAM_KEY;
    const vsUs = (playedByOpp[normalizeTeamName(t.team)] || []).map(r => {
      const cls = r.outcome === "W" ? "win" : "loss";
      return `${r.score || "?"} <span class="badge ${cls}">${r.outcome || "?"}</span>`;
    }).join("<br>");
    const trStyle = isUs ? ` style="background:rgba(123,182,230,0.25);font-weight:600;"` : "";
    rows += `<tr${trStyle}>
      <td>${t.team}</td>
      <td>${vsUs}</td>
      ${cols.map(c => {
        const v = t[c];
        return `<td>${c === "PCT" ? (v * 100).toFixed(2) + "%" : v}</td>`;
      }).join("")}
    </tr>`;
  });

  const header = ["TEAM", "RESULT", "W", "L", "T", "PF", "PA", "PD", "PCT", "GP"];
  return `<div style="overflow-x:auto;">
    <table>
      <thead><tr>${header.map(h => `<th>${h}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// Every season we can show, newest first: the live one plus anything archived.
function seasonList() {
  const seasons = [{
    label: DATA.season.label || String(DATA.season.year),
    record: DATA.season.record,
    standings: DATA.standings || {},
    schedule: DATA.schedule || [],
    current: true,
  }];
  (DATA.archive || []).forEach(a => seasons.push({
    label: a.label || String(a.year),
    record: a.record,
    standings: a.final_standings || {},
    schedule: a.schedule || [],
    current: false,
  }));
  return seasons;
}

// Augment a stored standings row with computed GP / PD / PCT.
function computeStandingsRow(t) {
  const GP = t.W + t.L + t.T;
  const PD = t.PF - t.PA;
  const PCT = GP > 0 ? (t.W + 0.5 * t.T) / GP : 0;
  return { ...t, GP, PD, PCT };
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}

// --- Bootstrap ---
async function load() {
  DATA = await fetch("data.json").then(r => r.json());
  KEYS = await fetch("keys.json").then(r => r.json());
  sb = supabase.createClient(KEYS.supabaseUrl, KEYS.supabaseAnonKey);
  await loadRsvps();
  subscribeRsvps();
  const lu = DATA.season && DATA.season.lastUpdated;
  if (lu) document.getElementById("last-updated").textContent = lu;
  const label = DATA.season && DATA.season.label;
  if (label) document.getElementById("season-label").textContent = `Softball · ${label}`;
  renderHome();
  renderSchedule();
  renderStats();
  renderSeasons();
  openRsvpFromUrl();
}

// Support shareable RSVP links: "?rsvp=next" opens the next scheduled game,
// "?rsvp=2026-08-20" opens that specific date. Anything else is ignored.
function openRsvpFromUrl() {
  const want = new URLSearchParams(location.search).get("rsvp");
  if (!want) return;
  let date = null;
  if (want === "next" || want === "1") {
    date = nextScheduledGame()?.date || null;
  } else if (/^\d{4}-\d{2}-\d{2}$/.test(want)) {
    date = DATA.schedule.some(g => g.date === want) ? want : null;
  }
  if (date) openRsvp(date);
}

// Chronological order: date, then start time (doubleheaders share a date).
function byDateTime(a, b) {
  return a.date.localeCompare(b.date) || String(a.time || "").localeCompare(String(b.time || ""));
}

// All games on a date, in start-time order. RSVPs are one per night, so a
// doubleheader shares a single RSVP across both games.
function gamesOn(date) {
  return DATA.schedule.filter(g => g.date === date).sort(byDateTime);
}

// "vs. A (8:30 PM) & B (9:30 PM)" for a doubleheader, "vs. A" otherwise.
function opponentsLine(date) {
  const gs = gamesOn(date);
  if (gs.length <= 1) return `vs. ${gs[0]?.opponent || "TBD"}`;
  return "vs. " + gs.map(g => `${g.opponent || "TBD"}${g.time ? ` (${fmtTime(g.time)})` : ""}`).join(" &amp; ");
}

// The soonest game still awaiting results, by date.
function nextScheduledGame() {
  return [...DATA.schedule]
    .filter(g => g.status === "scheduled" || g.status === "upcoming")
    .sort(byDateTime)[0] || null;
}

async function loadRsvps() {
  try {
    const { data, error } = await sb.from("rsvps").select("*");
    if (error) throw error;
    RSVPS = {};
    for (const r of data || []) {
      if (!RSVPS[r.game_date]) RSVPS[r.game_date] = {};
      RSVPS[r.game_date][r.player_nick] = { status: r.status, ts: r.updated_at };
    }
  } catch (e) {
    console.error("Could not load RSVPs:", e);
    RSVPS = {};
  }
}

function subscribeRsvps() {
  sb.channel("rsvps-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "rsvps" }, (payload) => {
      const r = payload.new || payload.old;
      if (!r) return;
      if (payload.eventType === "DELETE") {
        if (RSVPS[r.game_date]) delete RSVPS[r.game_date][r.player_nick];
      } else {
        if (!RSVPS[r.game_date]) RSVPS[r.game_date] = {};
        RSVPS[r.game_date][r.player_nick] = { status: r.status, ts: r.updated_at };
      }
      renderHome();
      renderSchedule();
      if (document.getElementById("rsvp-modal").classList.contains("active")) {
        renderRsvpModal();
      }
    })
    .subscribe();
}

// --- Render stubs (each tab task fills these in) ---
function renderHome() {
  const home = document.getElementById("home");
  const { season, schedule } = DATA;
  const played = schedule.filter(g => g.status === "played")
                          .sort(byDateTime);
  const upcoming = schedule.filter(g => g.status === "scheduled" || g.status === "upcoming")
                            .sort(byDateTime);
  const lastGame = played[played.length - 1];
  const nextGame = upcoming[0];
  const recordStr = `${season.record.W}–${season.record.L}`;

  let html = "";
  html += `<div class="card"><h3>Season Record</h3><div class="big">${recordStr}</div></div>`;

  if (nextGame) {
    const rsvps = rosterRsvps(nextGame.date);
    const inCount = Object.values(rsvps).filter(r => r.status === "IN").length;
    const outCount = Object.values(rsvps).filter(r => r.status === "OUT").length;
    const mainKeys = new Set(DATA.roster.map(p => p.nickname || p.name));
    const respondedMains = Object.keys(rsvps).filter(k => mainKeys.has(k)).length;
    const unconfirmed = mainKeys.size - respondedMains;
    html += `<div class="card">
      <h3>Next Game</h3>
      <div class="row" style="border:0;padding:0;align-items:center;">
        <div>
          <div><strong>${fmtDate(nextGame.date)}</strong> · ${opponentsLine(nextGame.date)}
            ${nextGame.note ? `<span class="badge playoff">${nextGame.note}</span>` : ""}</div>
          <div class="label" style="margin-top:6px;">${gamesOn(nextGame.date).length > 1
            ? `${nextGame.location || "Field TBD"} · one RSVP covers both games`
            : whereWhen(nextGame)}</div>
          <div style="margin-top:10px;">
            <span class="label">RSVPs:</span>
            ${inCount} IN · ${outCount} OUT · ${unconfirmed} ?
          </div>
        </div>
        <button class="primary" onclick="openRsvp('${nextGame.date}')">RSVP</button>
      </div>
    </div>`;
  }

  if (lastGame) {
    const r = lastGame.result || {};
    const badgeCls = r.outcome === "W" ? "win" : "loss";
    html += `<div class="card">
      <h3>Last Game</h3>
      <div><strong>${fmtDate(lastGame.date)}</strong> vs. ${lastGame.opponent || "TBD"}</div>
      <div style="margin-top:6px;">${r.score || "?"} <span class="badge ${badgeCls}">${r.outcome || "?"}</span></div>
    </div>`;
  }

  // League standings
  const standings = DATA.standings || {};
  const table = standingsTableHtml(standings.teams, played);
  if (table) {
    html += `<div class="card">
      <h3>League Standings${standings.lastUpdated ? ` · ${fmtDate(standings.lastUpdated)}` : ""}</h3>
      ${table}
    </div>`;
  }

  home.innerHTML = html;
}

// --- Seasons tab: record + final league standings for any season ---
let selectedSeason = 0;  // index into seasonList()

function renderSeasons() {
  const el = document.getElementById("seasons");
  const seasons = seasonList();
  const idx = Math.min(selectedSeason, seasons.length - 1);
  const s = seasons[idx];

  // "(this season)" for the live one, "(last season)" for the newest archive.
  const suffix = (season, i) => season.current ? " (this season)"
                              : i === 1 ? " (last season)" : "";

  let html = `<h2 style="margin-top:0;">Seasons</h2>
    <div class="card">
      <label class="label" for="season-picker">Select season</label>
      <select id="season-picker" style="width:100%;padding:8px;font-size:14px;margin-top:6px;">
        ${seasons.map((x, i) => `<option value="${i}" ${i === idx ? "selected" : ""}>${x.label}${suffix(x, i)}</option>`).join("")}
      </select>
      ${seasons.length === 1 ? `<div class="label" style="margin-top:8px;text-transform:none;">Past seasons show up here once this one wraps and the next opens.</div>` : ""}
    </div>`;

  const rec = s.record || {};
  const gamesPlayed = (s.schedule || []).filter(g => g.status === "played").length;
  html += `<div class="card">
    <h3>${s.label} Record</h3>
    <div class="big">${rec.W ?? 0}–${rec.L ?? 0}${rec.T ? `–${rec.T}` : ""}</div>
    <div class="label" style="margin-top:6px;">${gamesPlayed} game${gamesPlayed === 1 ? "" : "s"} played</div>
  </div>`;

  const table = standingsTableHtml((s.standings || {}).teams, s.schedule);
  const asOf = (s.standings || {}).lastUpdated;
  html += `<div class="card">
    <h3>League Standings${asOf ? ` · ${s.current ? "" : "Final · "}${fmtDate(asOf)}` : ""}</h3>
    ${table || `<p class="label" style="margin:0;">No standings posted for ${s.label} yet.</p>`}
  </div>`;

  el.innerHTML = html;

  const picker = document.getElementById("season-picker");
  if (picker) picker.addEventListener("change", (e) => {
    selectedSeason = Number(e.target.value) || 0;
    renderSeasons();
  });
}
function renderSchedule() {
  const el = document.getElementById("schedule");
  const games = [...DATA.schedule].sort(byDateTime);
  let html = `<h2 style="margin-top:0;">Schedule</h2>`;
  if (games.length === 0) {
    html += `<p class="label">No games scheduled yet.</p>`;
  }
  games.forEach(g => {
    if (g.status === "played") {
      const r = g.result || {};
      const badgeCls = r.outcome === "W" ? "win" : "loss";
      html += `<div class="card">
        <div class="row" style="border:0;padding:0;">
          <div>
            <div class="label">Game ${g.game} · ${fmtDate(g.date)}</div>
            <div><strong>vs. ${g.opponent || "TBD"}</strong></div>
          </div>
          <div style="text-align:right;">
            <div>${r.score || "?"}</div>
            <span class="badge ${badgeCls}">${r.outcome || "?"}</span>
          </div>
        </div>
      </div>`;
    } else if (g.status === "postponed") {
      html += `<div class="card">
        <div class="row" style="border:0;padding:0;align-items:flex-start;">
          <div>
            <div class="label">Game ${g.game} · ${fmtDate(g.date)}</div>
            <div><strong>vs. ${g.opponent || "TBD"}</strong></div>
            <div class="label" style="margin-top:4px;text-decoration:line-through;">${whereWhen(g)}</div>
            ${g.note ? `<div class="label" style="margin-top:6px;font-style:italic;">${g.note}</div>` : ""}
          </div>
          <span class="badge" style="background:#eee;color:var(--muted);">POSTPONED</span>
        </div>
      </div>`;
    } else {
      const rsvps = rosterRsvps(g.date);
      const inCount = Object.values(rsvps).filter(r => r.status === "IN").length;
      const outCount = Object.values(rsvps).filter(r => r.status === "OUT").length;
      const mainKeys = new Set(DATA.roster.map(p => p.nickname || p.name));
      const respondedMains = Object.keys(rsvps).filter(k => mainKeys.has(k)).length;
      const unconfirmed = mainKeys.size - respondedMains;
      html += `<div class="card">
        <div class="row" style="border:0;padding:0;align-items:flex-start;">
          <div>
            <div class="label">Game ${g.game} · ${fmtDate(g.date)}</div>
            <div><strong>vs. ${g.opponent || "TBD"}</strong>
              ${g.note ? `<span class="badge playoff">${g.note}</span>` : ""}</div>
            <div class="label" style="margin-top:4px;">${whereWhen(g)}</div>
            <div style="margin-top:8px;font-size:13px;">
              ${inCount} IN · ${outCount} OUT · ${unconfirmed} ?
            </div>
          </div>
          <button class="primary" onclick="openRsvp('${g.date}')">RSVP</button>
        </div>
      </div>`;
    }
  });
  el.innerHTML = html;
}

// RSVPs for a date, limited to names on the current roster (stale keys from
// renamed nicknames can't be deleted under the anon key, so they're ignored here).
function rosterRsvps(date) {
  const keys = new Set(DATA.roster.map(p => p.nickname || p.name));
  return Object.fromEntries(Object.entries(RSVPS[date] || {}).filter(([n]) => keys.has(n)));
}

let currentRsvpDate = null;
let currentRsvpName = null;

function openRsvp(date) {
  currentRsvpDate = date;
  currentRsvpName = null;
  document.getElementById("rsvp-modal").classList.add("active");
  renderRsvpModal();
}

function closeRsvp() {
  document.getElementById("rsvp-modal").classList.remove("active");
}

function renderRsvpModal() {
  const date = currentRsvpDate;
  const game = gamesOn(date)[0] || {};
  const rsvps = rosterRsvps(date);
  const myStatus = currentRsvpName ? (rsvps[currentRsvpName]?.status || "unconfirmed") : null;

  const inList = Object.entries(rsvps).filter(([, r]) => r.status === "IN").map(([n]) => n);
  const outList = Object.entries(rsvps).filter(([, r]) => r.status === "OUT").map(([n]) => n);
  const responded = new Set([...inList, ...outList]);
  const unconfirmed = DATA.roster
    .map(p => p.nickname || p.name)
    .filter(n => !responded.has(n));

  let html = `<div style="display:flex;justify-content:space-between;align-items:start;">
    <div>
      <h2>${fmtDate(date)} · ${opponentsLine(date)}</h2>
      <div class="label">${gamesOn(date).length > 1
        ? `${game.location || "Field TBD"} · one RSVP covers both games`
        : whereWhen(game)}</div>
    </div>
    <button class="secondary" onclick="closeRsvp()" style="padding:6px 12px;">Close</button>
  </div>
  <div style="margin-top:16px;">
    <label class="label">Who are you?</label>
    <select id="rsvp-name-picker" style="width:100%;padding:8px;font-size:14px;margin-top:4px;">
      <option value="">-- Select your name --</option>
      ${DATA.roster.map(p => {
        const key = p.nickname || p.name;
        const label = p.nickname ? `${p.nickname} (${p.name})` : p.name;
        return `<option value="${key}" ${key === currentRsvpName ? "selected" : ""}>${label}</option>`;
      }).join("")}
    </select>
  </div>`;

  if (currentRsvpName) {
    html += `<div style="margin-top:16px;text-align:center;">
      <div style="margin-bottom:8px;">Hey <strong>${currentRsvpName}</strong> — you're <strong>${myStatus}</strong></div>
      <button class="primary" onclick="submitRsvp('IN')" style="margin-right:8px;padding:14px 24px;">I'M IN</button>
      <button class="primary" onclick="submitRsvp('OUT')" style="background:#a82020;padding:14px 24px;">I'M OUT</button>
    </div>`;
  }

  html += `<div style="margin-top:20px;border-top:1px solid var(--border);padding-top:14px;">
    <div class="label">Team status</div>
    <div style="margin-top:8px;"><strong>IN (${inList.length}):</strong> ${inList.join(", ") || "—"}</div>
    <div style="margin-top:6px;"><strong>OUT (${outList.length}):</strong> ${outList.join(", ") || "—"}</div>
    <div style="margin-top:6px;color:var(--muted);"><strong>? (${unconfirmed.length}):</strong> ${unconfirmed.join(", ") || "—"}</div>
  </div>`;

  document.getElementById("rsvp-modal-content").innerHTML = html;
  const picker = document.getElementById("rsvp-name-picker");
  if (picker) picker.addEventListener("change", (e) => {
    currentRsvpName = e.target.value || null;
    renderRsvpModal();
  });
}

async function submitRsvp(status) {
  if (!currentRsvpName || !currentRsvpDate) return;

  // Optimistic update
  const prev = JSON.parse(JSON.stringify(RSVPS));
  if (!RSVPS[currentRsvpDate]) RSVPS[currentRsvpDate] = {};
  RSVPS[currentRsvpDate][currentRsvpName] = { status, ts: new Date().toISOString() };
  renderRsvpModal();
  renderSchedule();
  renderHome();

  try {
    const { error } = await sb.from("rsvps").upsert({
      game_date: currentRsvpDate,
      player_nick: currentRsvpName,
      status,
      updated_at: new Date().toISOString(),
    });
    if (error) throw error;
    toast(`Got it — you're ${status}`);
  } catch (e) {
    console.error(e);
    RSVPS = prev;  // revert
    renderRsvpModal();
    renderSchedule();
    renderHome();
    toast("Couldn't save — try again");
  }
}

function renderStats() {
  const el = document.getElementById("stats");
  const rows = Object.entries(DATA.stats_summary || {})
                     .filter(([, s]) => s.PA > 0)
                     .map(([nick, s]) => ({ nick, ...s }));
  if (rows.length === 0) {
    el.innerHTML = `<h2>Stats</h2><p class="label">No stats yet.</p>`;
    return;
  }
  const leaders = (key) => [...rows].sort((a, b) => b[key] - a[key]).slice(0, 3);
  const fmt = (n, d = 3) => Number(n).toFixed(d);

  // Until the current season has a logged game, the stats below are carryover
  // from the previous season kept in DATA.archive.
  const playedThisSeason = DATA.schedule.some(g => g.status === "played");
  const prior = (DATA.archive || [])[0];
  let html = `<h2 style="margin-top:0;">Stats</h2>`;
  if (!playedThisSeason && prior && prior.label) {
    html += `<p class="label" style="margin-top:-6px;">Showing ${prior.label} totals (${prior.record.W}–${prior.record.L}) — ${DATA.season.label || "the new season"} stats begin after Game 1.</p>`;
  }
  ["AVG", "OBP", "SLG", "OPS"].forEach(key => {
    html += `<div class="card"><h3>Top ${key}</h3>`;
    leaders(key).forEach(r => {
      html += `<div class="row"><span>${r.nick}</span><span>${fmt(r[key])}</span></div>`;
    });
    html += `</div>`;
  });
  ["HR", "RBI"].forEach(key => {
    html += `<div class="card"><h3>${key} Leaders</h3>`;
    leaders(key).forEach(r => {
      html += `<div class="row"><span>${r.nick}</span><span>${r[key]}</span></div>`;
    });
    html += `</div>`;
  });

  // Full sortable table
  const cols = ["nick", "G", "PA", "AB", "H", "HR", "RBI", "R", "BB", "K", "AVG", "OBP", "SLG", "OPS"];
  html += `<div class="card"><h3>Full Table</h3><div style="overflow-x:auto;"><table id="stats-table">
    <thead><tr>${cols.map(c => `<th data-col="${c}">${c === "nick" ? "PLAYER" : c.toUpperCase()}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(r => `<tr>${cols.map(c => {
      const v = r[c];
      const cell = typeof v === "number" && c.match(/AVG|OBP|SLG|OPS/) ? fmt(v) : v;
      return `<td>${cell}</td>`;
    }).join("")}</tr>`).join("")}
    </tbody></table></div></div>`;
  el.innerHTML = html;

  // Sortable columns
  document.querySelectorAll("#stats-table th").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.dataset.col;
      rows.sort((a, b) => {
        if (typeof a[col] === "number") return b[col] - a[col];
        return String(a[col]).localeCompare(String(b[col]));
      });
      renderStats();  // simple rerender
    });
  });
}

load();
</script>
</body>
</html>
